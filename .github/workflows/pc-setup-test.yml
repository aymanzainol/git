name: PC-Setup test (Windows)

on:
  workflow_dispatch:
  push:
    paths:
      - 'PC-Setup/**'
      - '.github/workflows/pc-setup-test.yml'

jobs:
  apps:
    name: Store updates + program installs
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Prepare the offline Office installer (Prepare-Office.cmd)
        shell: cmd
        run: |
          echo.| PC-Setup\Prepare-Office.cmd
          if errorlevel 1 exit /b 1
          dir PC-Setup\installers\Office

      - name: Run Setup-NewPC.ps1 (no Windows Update, no domain join)
        shell: powershell
        run: |
          # The runner image ships big developer tools a company PC won't have - don't spend the run updating them.
          $cfg = 'PC-Setup\config.psd1'
          (Get-Content $cfg) -replace 'UpgradeExclude\s*=\s*@\(\)', "UpgradeExclude = @('Microsoft.VisualStudio*','LLVM.*','Microsoft.VCRedist.*','ShiningLight.*','sbt.*','JRSoftware.*','ImageMagick.*')" | Set-Content $cfg
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File PC-Setup\Setup-NewPC.ps1 -SkipWindowsUpdate -Unattended
          $code = $LASTEXITCODE
          "Script exit code: $code"
          exit $code

      - name: Check the programs are really there
        if: always()
        shell: powershell
        run: |
          $checks = [ordered]@{
            'Google Chrome' = { Test-Path "$env:ProgramFiles\Google\Chrome\Application\chrome.exe" }
            'Foxit Reader'  = { [bool](Get-ItemProperty 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\*','HKLM:\SOFTWARE\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall\*' -EA SilentlyContinue | ? DisplayName -like 'Foxit PDF Reader*') }
            'WinRAR'        = { Test-Path "$env:ProgramFiles\WinRAR\WinRAR.exe" }
            'Microsoft 365' = { Test-Path "$env:ProgramFiles\Microsoft Office\root\Office16\WINWORD.EXE" }
            'Resume task removed' = { -not (Get-ScheduledTask -TaskName 'PCSetup-Resume' -EA SilentlyContinue) }
          }
          $fail = $false
          foreach ($k in $checks.Keys) { $ok = & $checks[$k]; "{0,-22} {1}" -f $k, $(if ($ok) {'OK'} else {'MISSING'}); if (-not $ok) { $fail = $true } }
          if ($fail) { exit 1 }

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pc-setup-logs
          path: C:\ProgramData\PCSetup\*.log

  windows-update:
    name: Windows Update stage (Defender definitions only)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Run Invoke-WindowsUpdateStage against real Windows Update
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          # Load the script's functions without running its main block.
          $ast = [System.Management.Automation.Language.Parser]::ParseFile("$PWD\PC-Setup\Setup-NewPC.ps1", [ref]$null, [ref]$null)
          foreach ($a in $ast.FindAll({ $args[0] -is [System.Management.Automation.Language.AssignmentStatementAst] -and $args[0].Parent -eq $ast.EndBlock }, $false)) {
            if ($a.Left.Extent.Text -in '$WuCallbackSource', '$WingetOk', '$InstallerOk') { . ([scriptblock]::Create($a.Extent.Text)) }
          }
          foreach ($f in $ast.FindAll({ $args[0] -is [System.Management.Automation.Language.FunctionDefinitionAst] }, $true)) { . ([scriptblock]::Create($f.Extent.Text)) }

          $WorkDir = "$env:RUNNER_TEMP\pcsetup"; New-Item -ItemType Directory $WorkDir -Force | Out-Null
          $StateFile = "$WorkDir\state.xml"; $LogFile = "$WorkDir\setup.log"
          $SkipWindowsUpdate = $false; $SkipDomainJoin = $true; $Unattended = $true

          # The runner can't restart; report instead.
          function Get-PendingReboot { @() }
          function Restart-AndResume($State, $Reason) { Write-Log "WOULD RESTART: $Reason" 'Warn'; throw 'restart-requested' }

          # Only Defender definition updates: small, quick, real download + install.
          $config = @{
            MaxUpdateRounds = 2; IncludeDrivers = $false; ExcludeTitle = 'Preview'
            ExcludeCategories = @('Security Updates','Critical Updates','Updates','Update Rollups','Upgrades','Feature Packs','Service Packs','Tools','Drivers')
          }
          $state = New-State
          try { Invoke-WindowsUpdateStage $state $config } catch { if ("$_" -ne 'restart-requested') { throw } }
          $state.Results | Format-Table -AutoSize | Out-String -Width 200
          if ($state.Results | Where-Object { $_.Result -like 'FAILED*' }) { exit 1 }
          if ($script:WuAsyncWarned) { Write-Host '::warning::Live progress fell back to synchronous mode' }

  first-sign-in:
    name: First sign-in pieces (auto sign-in, policies, tasks)
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Exercise the first sign-in functions
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $ast = [System.Management.Automation.Language.Parser]::ParseFile("$PWD\PC-Setup\Setup-NewPC.ps1", [ref]$null, [ref]$null)
          foreach ($a in $ast.FindAll({ $args[0] -is [System.Management.Automation.Language.AssignmentStatementAst] -and $args[0].Parent -eq $ast.EndBlock }, $false)) {
            if ($a.Left.Extent.Text -in '$LsaSource', '$WinlogonKey') { . ([scriptblock]::Create($a.Extent.Text)) }
          }
          foreach ($f in $ast.FindAll({ $args[0] -is [System.Management.Automation.Language.FunctionDefinitionAst] }, $true)) { . ([scriptblock]::Create($f.Extent.Text)) }
          $KitDir = "$PWD\PC-Setup"; $WorkDir = "$env:RUNNER_TEMP\pcsetup"; New-Item -ItemType Directory $WorkDir -Force | Out-Null
          $LogFile = "$WorkDir\setup.log"; $StateFile = "$WorkDir\state.xml"
          $FirstLogonDir = "$env:ProgramData\PCSetup-FirstLogon"; $FirstLogonTaskName = 'PCSetup-FirstLogon'; $CleanupTaskName = 'PCSetup-FirstLogonCleanup'
          $fail = @()
          function Check($name, $ok) { "{0,-45} {1}" -f $name, $(if ($ok) { 'OK' } else { 'FAIL' }); if (-not $ok) { $script:fail += $name } }

          # Automatic sign-in: LSA secret + Winlogon values, then cleanup
          $cred = New-Object PSCredential('ahmed.ali', (ConvertTo-SecureString 'Not-a-real-p4ss' -AsPlainText -Force))
          $account = Set-AutoLogon $cred 'example.local'
          $wl = Get-ItemProperty $WinlogonKey
          Check 'auto sign-in account'          ($account -eq 'example.local\ahmed.ali')
          Check 'AutoAdminLogon = 1'            ($wl.AutoAdminLogon -eq '1')
          Check 'AutoLogonCount = 1'            ($wl.AutoLogonCount -eq 1)
          Check 'no plain-text DefaultPassword' ($null -eq $wl.DefaultPassword)
          Check 'password stored as LSA secret' ([PCSetup.Lsa]::Exists('DefaultPassword'))
          Clear-AutoLogon
          $wl = Get-ItemProperty $WinlogonKey
          Check 'LSA secret removed'            (-not [PCSetup.Lsa]::Exists('DefaultPassword'))
          Check 'AutoAdminLogon = 0'            ($wl.AutoAdminLogon -eq '0')
          Clear-AutoLogon   # twice is fine

          # UPN form
          $cred = New-Object PSCredential('ahmed.ali@example.com', (ConvertTo-SecureString 'x' -AsPlainText -Force))
          Check 'UPN account kept as is'        ((Set-AutoLogon $cred 'example.local') -eq 'ahmed.ali@example.com')
          Clear-AutoLogon

          # Unreachable domain -> $null, not $false
          Check 'unreachable domain gives null' ($null -eq (Test-DomainCredential 'example.invalid' $cred))

          # Policies and default profile
          Set-MachinePolicies @{ RemoveNewOutlookApp = $true; OneDriveTenantId = '00000000-0000-0000-0000-000000000000' }
          $od = Get-ItemProperty 'HKLM:\SOFTWARE\Policies\Microsoft\OneDrive'
          Check 'OneDrive SilentAccountConfig'  ($od.SilentAccountConfig -eq 1)
          Check 'OneDrive KFMSilentOptIn'       ($od.KFMSilentOptIn -eq '00000000-0000-0000-0000-000000000000')
          Set-DefaultUserSettings
          reg.exe load 'HKU\T' "$env:SystemDrive\Users\Default\NTUSER.DAT" | Out-Null
          Check 'default profile ZeroConfigExchange' ((Get-ItemProperty 'Registry::HKEY_USERS\T\Software\Microsoft\Office\16.0\Outlook\AutoDiscover').ZeroConfigExchange -eq 1)
          Check 'default profile HideNewOutlookToggle' ((Get-ItemProperty 'Registry::HKEY_USERS\T\Software\Microsoft\Office\16.0\Outlook\Options\General').HideNewOutlookToggle -eq 1)
          [GC]::Collect(); reg.exe unload 'HKU\T' | Out-Null

          # Scheduled tasks
          Register-FirstLogonTasks @{ UserName = 'ahmed.ali' }
          $t1 = Get-ScheduledTask -TaskName $FirstLogonTaskName; $t2 = Get-ScheduledTask -TaskName $CleanupTaskName
          Check 'user task runs as Users group'  ($t1.Principal.GroupId -match 'Users|S-1-5-32-545')
          Check 'user task limited rights'       ($t1.Principal.RunLevel -eq 'Limited')
          Check 'user task passes -OnlyUser'     ($t1.Actions[0].Arguments -like '*-OnlyUser "ahmed.ali"*')
          Check 'cleanup task runs as SYSTEM'    ($t2.Principal.UserId -match 'SYSTEM|S-1-5-18')
          Check 'FirstLogon.ps1 copied'          (Test-Path "$FirstLogonDir\FirstLogon.ps1")

          # FirstLogon.ps1: other user -> does nothing; matching user -> runs once
          powershell -NoProfile -File "$FirstLogonDir\FirstLogon.ps1" -OnlyUser 'someone.else'
          Check 'skips other users'              (-not (Get-ItemProperty 'HKCU:\Software\PCSetup' -EA SilentlyContinue).FirstLogonDone)
          powershell -NoProfile -File "$FirstLogonDir\FirstLogon.ps1" -OnlyUser $env:USERNAME
          Check 'runs for the target user'       ((Get-ItemProperty 'HKCU:\Software\PCSetup').FirstLogonDone -eq 1)
          Get-Content "$env:LOCALAPPDATA\PCSetup-FirstLogon.log"

          # Cleanup as it runs at first sign-in
          $cred = New-Object PSCredential('ahmed.ali', (ConvertTo-SecureString 'x' -AsPlainText -Force)); Set-AutoLogon $cred 'example.local' | Out-Null
          $KitDir = "$env:RUNNER_TEMP\kitcopy"; New-Item -ItemType Directory "$KitDir\installers\Office" -Force | Out-Null
          Invoke-FirstLogonCleanup
          Check 'cleanup removed LSA secret'     (-not [PCSetup.Lsa]::Exists('DefaultPassword'))
          Check 'cleanup removed its task'       (-not (Get-ScheduledTask -TaskName $CleanupTaskName -EA SilentlyContinue))
          Check 'cleanup removed installers'     (-not (Test-Path "$KitDir\installers"))

          if ($fail) { throw "Failed: $($fail -join ', ')" }
