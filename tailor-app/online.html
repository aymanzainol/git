  const LKEY = "tailor-orders-v1", PKEY = "tailor-prefs-v1", CKEY = "tailor-settings-v1";
  const $ = (id) => document.getElementById(id);
  const load = (k, d) => { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } };
  const store = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} };

  // Per-viewer preferences (language, message language) stay in this browser.
  const prefs = Object.assign({ lang: "ar", msgLang: "auto" }, load(PKEY, {}));
  // Shop-wide settings are shared through the database when online.
  let shop = Object.assign({ shop: "", code: "966" }, load(CKEY, {}));

  let mode = "loading";      // "loading" | "cloud" | "local"
  let readOnly = false;
  let orders = [];
  let filter = "all";
  let editingId = null;
  let pendingDelete = null;
  let ordersCol = null, shopRef = null, downloads = null;

  const t = (k) => I18N[prefs.lang][k];
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const digits = (s) => String(s || "").replace(/\D/g, "");
  const today = () => { const d = new Date(); return new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10); };
  let sample = null, canScan = false, pendingPhoto = null;
  const canPhoto = () => mode === "server";
  const photoUrl = (o) => `photos/${encodeURIComponent(o.id)}?v=${o.photo}`;
  const qtyOf = (o) => Math.min(99, Math.max(1, parseInt(o && o.qty, 10) || 1));
  const newId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);

  function toast(msg) {
    const el = $("toast"); el.textContent = msg; el.classList.add("show");
    clearTimeout(toast._t); toast._t = setTimeout(() => el.classList.remove("show"), 2200);
  }

  let noteKey = null;
  function setNote(key) { noteKey = key; const n = $("note"); n.hidden = !key; if (key) n.textContent = t(key); }

  // ---------- storage ----------
  // Server mode (Railway): a small REST API with a shop password.
  async function api(method, url, body) {
    const r = await fetch(url, { method, credentials: "same-origin", headers: body ? { "Content-Type": "application/json" } : {}, body: body ? JSON.stringify(body) : undefined });
    if (r.status === 401) { reportOk = false; throw { code: "login" }; }
    if (!r.ok) throw { code: "http_" + r.status };
    return r.json();
  }
  function upsertLocal(o) {
    const i = orders.findIndex((x) => x.id === o.id);
    if (i >= 0) orders[i] = o; else orders.push(o);
  }
  async function saveOrder(o) {
    if (mode === "cloud") { await ordersCol.doc(o.id).set(o); return; }
    if (mode === "server") { upsertLocal(await api("PUT", "api/orders/" + encodeURIComponent(o.id), o)); render(); return; }
    const i = orders.findIndex((x) => x.id === o.id);
    if (i >= 0) orders[i] = o; else orders.push(o);
    store(LKEY, orders); render();
  }
  async function removeOrder(id) {
    if (mode === "cloud") { await ordersCol.doc(id).delete(); return; }
    if (mode === "server") { await api("DELETE", "api/orders/" + encodeURIComponent(id)); orders = orders.filter((x) => x.id !== id); render(); return; }
    orders = orders.filter((x) => x.id !== id); store(LKEY, orders); render();
  }
  async function saveShop() {
    store(CKEY, shop);
    if (mode === "cloud") await shopRef.set({ shop: shop.shop, code: shop.code });
    if (mode === "server") await api("PUT", "api/config", { shop: shop.shop, code: shop.code });
  }
  function writeFailed(e) {
    if (e && e.code === "login") return;
    if (e && (e.code === "invalid_argument" || e.code === "not_granted" || e.code === "revoked")) {
      readOnly = true; setNote("noteReadOnly"); render();
    } else toast(t("saveErr"));
  }

  function goLocal() {
    mode = "local"; orders = load(LKEY, []); setNote("noteLocal"); applyLang();
  }

  // ---------- server mode ----------
  let serverScan = false, pollTimer = null, reportOk = false, lastSig = "";
  async function pullState() {
    try {
      const st = await api("GET", "api/state");
      const sig = JSON.stringify([st.orders, st.config, st.scan, st.report]);
      if (sig === lastSig && loaded) return true;   // nothing changed – skip re-rendering
      lastSig = sig;
      orders = st.orders || [];
      if (st.config) { shop = { shop: String(st.config.shop || ""), code: String(st.config.code || "966") }; store(CKEY, shop); }
      serverScan = !!st.scan; canScan = true; reportOk = !!st.report;
      if (view === "report" && !reportOk) setView("orders");
      loaded = true;
      if (noteKey === "noteSlow") setNote(null);
      applyLang();
      return true;
    } catch (e) {
      if (e && e.code !== "login") setNote("noteSlow");
      return false;
    }
  }
  async function initServer() {
    let probe;
    try { probe = await fetch("api/state", { credentials: "same-origin" }); } catch { return false; }
    if (probe.status !== 200) return false;
    mode = "server";
    await pullState();
    if (location.hash === "#report") setView("report");
    setupInstall();
    startPolling();
    return true;
  }
  function startPolling() {
    clearInterval(pollTimer);
    pollTimer = setInterval(() => { if (!document.hidden) pullState(); }, 20000);
  }
  document.addEventListener("visibilitychange", () => { if (mode === "server" && !document.hidden) pullState(); });

  function showLogin() {
    if ($("loginDlg").open) return;
    const lg = $("loginLogo"); if (!lg.src) { lg.onload = () => { lg.hidden = false; }; lg.src = "icon-192.png"; }
    $("loginErr").textContent = ""; $("loginPw").value = "";
    $("loginDlg").showModal(); $("loginPw").focus();
  }
  $("loginForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    $("loginBtn").disabled = true; $("loginErr").textContent = "";
    try {
      const r = await fetch("api/login", { method: "POST", credentials: "same-origin", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ password: $("loginPw").value }) });
      if (r.ok) { $("loginDlg").close(); reportOk = true; setView("report"); }
      else $("loginErr").textContent = r.status === 429 ? t("loginTooMany") : t("loginWrong");
    } catch { $("loginErr").textContent = t("saveErr"); }
    finally { $("loginBtn").disabled = false; }
  });
  $("loginCancel").onclick = () => $("loginDlg").close();
  $("lockBtn").onclick = async () => {
    try { await fetch("api/logout", { method: "POST", credentials: "same-origin" }); } catch {}
    reportOk = false;
    if (location.hash === "#report") location.hash = "#orders"; else setView("orders");
  };

  async function initCloud() {
    if (!window.claude || typeof window.claude.use !== "function") {
      if (location.protocol.startsWith("http") && await initServer()) return;
      return goLocal();
    }
    const db = await window.claude.use("db");
    if (!db) return goLocal();
    mode = "cloud";
    ordersCol = db.collection("orders");
    shopRef = db.doc("config/shop");

    window.claude.use("downloads").then((d) => { downloads = d; });
    window.claude.use("sample").then(async (s) => {
      if (!s) return;
      const caps = await s.limits().catch(() => null);
      if (!caps || !caps.images) return;
      sample = s; canScan = true;
      $("scanFile").accept = caps.images.mediaTypes.join(",") || "image/*";
      if ($("orderDlg").open) $("scanBtn").hidden = false;
    });
    window.claude.use("user").then(async (u) => {
      const can = u ? await u.can("data.write") : null;
      if (can === false) { readOnly = true; setNote("noteReadOnly"); render(); }
    });

    let slow = setTimeout(() => setNote("noteSlow"), 10000);
    ordersCol.onSnapshot((snap) => {
      orders = snap.docs.map((d) => ({ ...d.data(), id: d.id }));
      if (!snap.metadata.fromCache) { clearTimeout(slow); if (noteKey === "noteSlow") setNote(readOnly ? "noteReadOnly" : null); loaded = true; }
      render();
    }, () => { clearTimeout(slow); setNote("noteSlow"); loaded = true; render(); });
    shopRef.onSnapshot((snap) => {
      if (snap.exists) { const d = snap.data(); shop = { shop: String(d.shop || ""), code: String(d.code || "966") }; store(CKEY, shop); applyLang(); }
    }, () => {});
    applyLang();
  }
  let loaded = false;

  // ---------- rendering ----------
  function applyLang() {
    const L = I18N[prefs.lang];
    document.documentElement.lang = prefs.lang;
    document.documentElement.dir = L.dir;
    document.title = L.appTitle;
    $("addBtn").innerHTML = ICON.plus + `<span>${esc(L.add.replace(/^\+\s*/, ""))}</span>`;
    $("search").placeholder = L.search;
    document.querySelectorAll("[data-t]").forEach((el) => { el.textContent = L[el.dataset.t]; });
    document.querySelectorAll(".langs button").forEach((b) => { const on = b.dataset.lang === prefs.lang; b.classList.toggle("on", on); b.setAttribute("aria-checked", on); });
    $("reportBtn").setAttribute("aria-label", L.tabReport); $("reportBtn").title = L.tabReport;
    $("settingsBtn").setAttribute("aria-label", L.settings); $("settingsBtn").title = L.settings;
    $("langCur").textContent = { ar: "العربية", en: "English", ur: "اردو" }[prefs.lang];
    $("backupHint").textContent = mode === "cloud" || mode === "server" ? L.hintCloud : L.hintLocal;
    if (noteKey) setNote(noteKey);
    render();
  }

  function waNumber(mobile) {
    let d = digits(mobile);
    if (d.startsWith("00")) d = d.slice(2);
    else if (d.startsWith("0")) d = digits(shop.code) + d.slice(1);
    return d;
  }
  function waLink(o) {
    const lang = prefs.msgLang === "auto" ? prefs.lang : prefs.msgLang;
    return `https://wa.me/${waNumber(o.mobile)}?text=${encodeURIComponent(I18N[lang].msg(o, shop.shop || I18N[lang].shopSig))}`;
  }

  const svg = (d, extra = "") => `<svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"${extra}>${d}</svg>`;
  const ICON = {
    check: svg('<path d="M20 6 9 17l-5-5"/>'),
    truck: svg('<path d="M3 7h11v9H3z"/><path d="M14 10h4l3 3v3h-7"/><circle cx="7" cy="17.5" r="1.8"/><circle cx="17" cy="17.5" r="1.8"/>'),
    phone: svg('<path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2"/>'),
    copy: svg('<rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h8"/>'),
    edit: svg('<path d="M4 20h4L19 9l-4-4L4 16z"/><path d="m13.5 6.5 4 4"/>'),
    trash: svg('<path d="M4 7h16"/><path d="M10 11v6M14 11v6"/><path d="M6 7l1 13h10l1-13"/><path d="M9 7V4h6v3"/>'),
    photo: svg('<path d="M4 4h16v16H4z"/><circle cx="9" cy="9" r="2"/><path d="m20 16-5-5L4 20"/>'),
    plus: svg('<path d="M12 5v14M5 12h14"/>', ' width="20" height="20"'),
    hanger: svg('<path d="M12 7a2 2 0 1 1 2 2c-1.1 0-2 .9-2 2"/><path d="M12 11 2.6 17.6a1 1 0 0 0 .6 1.8h17.6a1 1 0 0 0 .6-1.8z"/>', ' width="44" height="44" stroke-width="1.6"'),
    wa: '<svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M12 2.2a9.8 9.8 0 0 0-8.4 14.8L2.2 21.8l4.9-1.3A9.8 9.8 0 1 0 12 2.2Zm0 17.8a8 8 0 0 1-4.1-1.1l-.3-.2-2.9.8.8-2.8-.2-.3A8 8 0 1 1 12 20Z"/><path fill="currentColor" d="M16.4 13.9c-.2-.1-1.4-.7-1.6-.8-.2-.1-.4-.1-.5.1l-.7.9c-.1.2-.3.2-.5.1a6.5 6.5 0 0 1-3.2-2.8c-.2-.4.2-.4.7-1.3.1-.2 0-.3 0-.4l-.7-1.7c-.2-.4-.4-.4-.5-.4h-.5a.9.9 0 0 0-.6.3 2.7 2.7 0 0 0-.8 2c0 1.2.9 2.3 1 2.5.1.2 1.7 2.6 4.2 3.7 1.6.7 2.2.7 3 .6.5-.1 1.4-.6 1.6-1.1.2-.6.2-1 .1-1.1l-.5-.6Z"/></svg>',
  };

  function render() {
    const counts = { pending: 0, ready: 0, delivered: 0 };
    orders.forEach((o) => { if (counts[o.status] !== undefined) counts[o.status]++; });
    $("cPending").textContent = counts.pending;
    $("cReady").textContent = counts.ready;
    $("cDelivered").textContent = counts.delivered;
    document.querySelectorAll(".stat").forEach((s) => s.classList.toggle("on", s.dataset.filter === filter));
    $("addBtn").hidden = readOnly || mode === "loading" || view === "report";
    if (view === "report") renderReport();

    const list = $("list");
    if (mode === "loading" || ((mode === "cloud" || mode === "server") && !loaded && !orders.length)) {
      list.innerHTML = `<div class="empty">${ICON.hanger}<div>${esc(t("loading"))}</div></div>`; return;
    }
    const q = $("search").value.trim().toLowerCase();
    const rank = { ready: 0, pending: 1, delivered: 2 };
    const shown = orders
      .filter((o) => filter === "all" || o.status === filter)
      .filter((o) => !q || [o.name, o.mobile, o.book, o.invoice].some((v) => String(v || "").toLowerCase().includes(q)))
      .sort((a, b) => (rank[a.status] ?? 3) - (rank[b.status] ?? 3) || (b.updated || 0) - (a.updated || 0));

    if (!shown.length) { list.innerHTML = `<div class="empty">${ICON.hanger}<div>${esc(orders.length ? t("noMatch") : t("empty"))}</div></div>`; return; }
    const td = today();
    const ro = readOnly ? " disabled" : "";
    const fact = (label, value, cls = "") => value ? `<div class="fact ${cls}"><span>${esc(label)}</span><b dir="ltr">${esc(value)}</b></div>` : "";
    const tool = (act, icon, label, extra = "") => `<button class="tool${act === "del" ? " danger" : ""}" data-act="${act}" aria-label="${esc(label)}" title="${esc(label)}"${extra}>${icon}</button>`;
    list.innerHTML = shown.map((o) => {
      const late = o.status !== "delivered" && o.due && o.due < td;
      const initial = (String(o.name || "?").trim()[0] || "?").toUpperCase();
      return `
      <article class="order ${esc(o.status)}" data-id="${esc(o.id)}">
        <div class="order-top">
          <div class="avatar" aria-hidden="true">${esc(initial)}</div>
          <div class="who"><div class="name">${esc(o.name)}</div><div class="sub" dir="ltr">${esc(o.mobile)}</div></div>
          <span class="badge ${esc(late ? "late" : o.status)}">${esc(late ? t("kOverdue") : (t(o.status) || o.status))}</span>
        </div>
        <div class="facts">
          ${fact(t("invoice"), "#" + o.invoice)}
          ${fact(t("qtyShort"), String(qtyOf(o)))}
          ${fact(t("book"), o.book)}
          ${fact(t("invDateShort"), o.invDate)}
          ${fact(t("due"), o.due, late ? "late" : "")}
          ${fact(t("clearedShort"), o.cleared)}
        </div>
        ${o.notes ? `<div class="notes">${esc(o.notes)}</div>` : ""}
        <div class="actions">
          <div class="main-act">
            ${o.status === "pending" ? `<button class="btn ready" data-act="ready"${ro}>${ICON.check}${esc(t("markReady").replace(/^✓\s*/, ""))}</button>` : ""}
            ${o.status === "ready" ? `<a class="btn wa" href="${esc(waLink(o))}" target="_blank" rel="noopener">${ICON.wa}${esc(t("notify"))}</a>
                                     <button class="btn primary" data-act="delivered"${ro}>${ICON.truck}${esc(t("markDelivered"))}</button>` : ""}
          </div>
          <div class="tools">
            <a class="tool" href="tel:${esc(digits(o.mobile))}" aria-label="${esc(t("call"))}" title="${esc(t("call"))}">${ICON.phone}</a>
            ${tool("copy", ICON.copy, t("copy"))}
            ${o.photo && mode === "server" ? tool("photo", ICON.photo, t("viewPhoto")) : ""}
            ${tool("edit", ICON.edit, t("edit"), ro)}
            ${tool("del", ICON.trash, t("del"), ro)}
          </div>
        </div>
      </article>`;
    }).join("");

  function period(mode, offset) {

    else if (mode === "week") { start = new Date(a.getFullYear(), a.getMonth(), a.getDate() - a.getDay() + 7 * offset); end = new Date(start.getFullYear(), start.getMonth(), start.getDate() + 7); }
    else { start = new Date(a.getFullYear(), a.getMonth() + offset, 1); end = new Date(start.getFullYear(), start.getMonth() + 1, 1); }

    for (const o of orders) {

  function barPath(x, y, w, h) {

    const step = Math.ceil(maxV / 4), top = step * 4;
    const y = (v) => T + ph - (v / top) * ph;
    const gw = pw / n, bw = Math.max(4, Math.min(22, (gw - 12) / 2));

    for (const v of [step * 2, top]) svg += `<line class="grid" x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}"/><text x="${L - 6}" y="${y(v) + 4}" text-anchor="end">${v}</text>`;
    svg += `<text x="${L - 6}" y="${y(0) + 4}" text-anchor="end">0</text>`;
    buckets.forEach((b, i) => {

      if (last) svg += `<rect class="sel" x="${gx + 1}" y="${T - 16}" width="${gw - 2}" height="${ph + 16}" rx="6"/>`;
      const x1 = cx - bw - 1, x2 = cx + 1;
      svg += `<path d="${barPath(x1, y(b.s.n), bw, y(0) - y(b.s.n))}" fill="var(--s-new)"/>`;
      svg += `<path d="${barPath(x2, y(b.s.dl), bw, y(0) - y(b.s.dl))}" fill="var(--s-del)"/>`;
      if (last) svg += `<text class="val" x="${x1 + bw / 2}" y="${y(b.s.n) - 4}" text-anchor="middle">${b.s.n}</text><text class="val" x="${x2 + bw / 2}" y="${y(b.s.dl) - 4}" text-anchor="middle">${b.s.dl}</text>`;
      svg += `<text x="${cx}" y="${H - 6}" text-anchor="middle"${last ? ' class="val"' : ""}>${esc(shortLabel(b.p))}</text>`;
      svg += `<rect class="hit" data-i="${i}" x="${gx}" y="0" width="${gw}" height="${H}"/>`;
    });
    svg += `<line class="base" x1="${L}" x2="${W - R}" y1="${y(0)}" y2="${y(0)}"/></svg>`;

      buckets.slice().reverse().map((b) => `<tr class="${b.p.offset === rOffset ? "cur" : ""}"><td>${esc(longLabel(b.p))}</td><td>${b.s.n}</td><td>${b.s.rd}</td><td>${b.s.dl}</td></tr>`).join("") + "</tbody>";

  async function shrink(file) {
    try {
      const img = await createImageBitmap(file);
      const k = Math.min(1, 1800 / Math.max(img.width, img.height));
      const c = document.createElement("canvas");
      c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      const blob = await new Promise((r) => c.toBlob(r, "image/jpeg", 0.85));
      return blob || file;
    } catch { return file; }
  }
  const asDate = (s) => /^\d{4}-\d{2}-\d{2}$/.test(String(s || "")) ? String(s) : "";
  const westernDigits = (s) => String(s ?? "").replace(/[٠-٩]/g, (d) => "٠١٢٣٤٥٦٧٨٩".indexOf(d)).replace(/[۰-۹]/g, (d) => "۰۱۲۳۴۵۶۷۸۹".indexOf(d)).trim();

  // ---------- built-in OCR (used on Railway when no Anthropic API key is set) ----------
  const SHOP_PHONES = ["0563918278", "0560716819"];
  let tessLoading = null;
  function loadTesseract() {
    if (window.Tesseract) return Promise.resolve();
    return tessLoading || (tessLoading = new Promise((resolve, reject) => {
      const sc = document.createElement("script");
      sc.src = "https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js";
      sc.onload = resolve;
      sc.onerror = () => { tessLoading = null; reject({ code: "ocr_load" }); };
      document.head.appendChild(sc);
    }));
  }
  function pickFields(data) {
    const text = String(data.text || "").replace(/[٠-٩]/g, (d) => "٠١٢٣٤٥٦٧٨٩".indexOf(d)).replace(/[۰-۹]/g, (d) => "۰۱۲۳۴۵۶۷۸۹".indexOf(d));
    const flat = text.replace(/[\s-]/g, "");
    const phones = (flat.match(/(?:\+?966|0)5\d{8}/g) || []).map((n) => n.replace(/^\+?966/, "0"));
    const mobile = phones.find((n) => !SHOP_PHONES.includes(n)) || "";
    let date = "", m;
    if ((m = text.match(/(20\d{2})[-/.](\d{1,2})[-/.](\d{1,2})/))) date = `${m[1]}-${pad(m[2])}-${pad(m[3])}`;
    else if ((m = text.match(/(\d{1,2})[-/.](\d{1,2})[-/.](20\d{2})/))) date = `${m[3]}-${pad(m[2])}-${pad(m[1])}`;
    if (date && isNaN(parseYmd(date))) date = "";

    const label = /(invoice|inv|no\b|no\.|n°|#|رقم|فاتورة|الفاتورة|انوائس|بل)/i;
    for (const line of text.split(/\n/)) {
      if (!label.test(line)) continue;
      const nums = (line.match(/\d{2,10}/g) || []).filter((n) => !skip(n));
      if (nums.length) { invoice = nums[0]; break; }
    }
    if (!invoice) {
      // Otherwise take the largest printed number on the page (invoice numbers are usually big).
      const words = (data.words || []).map((w) => ({
        n: String(w.text || "").replace(/[٠-٩]/g, (d) => "٠١٢٣٤٥٦٧٨٩".indexOf(d)).replace(/[^\d]/g, ""),
        h: w.bbox ? w.bbox.y1 - w.bbox.y0 : 0, c: w.confidence || 0,

      words.sort((a, b) => b.h - a.h);
      invoice = words.length ? words[0].n : "";
    }
    return { invoice, date, mobile, name: "", book: "" };
  }

      const items = [...$("langList").querySelectorAll("button")];
      const i = items.indexOf(document.activeElement);
      items[(i + (e.key === "ArrowDown" ? 1 : items.length - 1)) % items.length].focus();
    }
  });
  document.querySelectorAll(".langs button").forEach((b) => b.addEventListener("click", () => {
    langMenu(false);
    prefs.lang = b.dataset.lang; store(PKEY, prefs); applyLang();
  }));

  // ---------- add to home screen ----------
  const IKEY = "tailor-install-later";
  let installPrompt = null;
  const isStandalone = () => matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;
  const isIOS = () => /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
  const UA = navigator.userAgent;
  const inAppBrowser = () => /FBAN|FBAV|Instagram|Line\/|Snapchat|TikTok|musical_ly|Twitter|LinkedInApp|; wv\)/i.test(UA);
  // Which way of adding to the home screen works on this phone and browser.
  function installWay() {
    if (installPrompt) return "prompt";
    if (isIOS()) return inAppBrowser() ? "ios-inapp" : /CriOS|EdgiOS|FxiOS|OPiOS/i.test(UA) ? "ios-chrome" : "ios-safari";
    if (/android/i.test(UA)) return inAppBrowser() ? "android-inapp" : "android-menu";
    return null;   // computer without an install offer: nothing to show
  }
  const canInstall = () => mode === "server" && !isStandalone() && !!installWay();
  const SHARE_ICON = '<svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="m8 7 4-4 4 4"/><path d="M6 11H5v10h14V11h-1"/></svg>';
  const DOTS_ICON = '<svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="currentColor"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg>';
  const MENU_ICON = '<svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="currentColor"><circle cx="12" cy="5" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="12" cy="19" r="2"/></svg>';
  const ADD_ICON = '<svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="4" y="4" width="16" height="16" rx="4"/><path d="M12 8v8M8 12h8"/></svg>';
  function showInstall(force) {
    if (!canInstall()) return;
    if (!force) { let until = 0; try { until = Number(localStorage.getItem(IKEY)) || 0; } catch {} if (until > Date.now()) return; }
    const way = installWay();
    if (!$("installIcon").src) $("installIcon").src = "icon-192.png";
    const text = { "prompt": "installAndroid", "ios-safari": "installIos", "ios-chrome": "installIosChrome", "ios-inapp": "installInApp", "android-menu": "installAndroidMenu", "android-inapp": "installInApp" }[way];
    const steps = way === "ios-safari" ? `<ol class="isteps">${t("iosSteps").map((x) => `<li>${esc(x)}</li>`).join("")}</ol>` : "";
    $("installMsg").innerHTML = (steps || esc(t(text)))
      .replace("{share}", SHARE_ICON).replace("{add}", ADD_ICON).replace("{menu}", MENU_ICON).replace("{dots}", DOTS_ICON)
      .replace("{browser}", isIOS() ? "Safari" : "Chrome");
    const inApp = way === "ios-inapp" || way === "android-inapp";
    $("installGo").hidden = !(way === "prompt" || inApp);
    $("installGo").textContent = inApp ? t("copyLink") : t("installGo");
    $("installGo").dataset.way = way;
    $("installLater").textContent = way === "prompt" ? t("installLater") : t("done");
    $("installBar").hidden = false;
    document.documentElement.style.setProperty("--install-h", $("installBar").offsetHeight + "px");
    document.body.classList.add("has-install");
  }
  function hideInstall(remember) {
    $("installBar").hidden = true;
    document.body.classList.remove("has-install");
    if (remember) { try { localStorage.setItem(IKEY, String(Date.now() + 14 * 864e5)); } catch {} }
  }
  window.addEventListener("beforeinstallprompt", (e) => {
    e.preventDefault(); installPrompt = e; refreshInstallEntry();
    if (mode !== "server") return;
    // Switch an open "use the menu" message to the one-tap Install button.
    if (!$("installBar").hidden) showInstall(true); else showInstall(false);
  });
  window.addEventListener("appinstalled", () => { installPrompt = null; hideInstall(false); refreshInstallEntry(); });
  $("installLater").onclick = () => hideInstall(true);
  $("installGo").onclick = async () => {
    if ($("installGo").dataset.way !== "prompt") {
      const link = location.origin + "/";
      try { await navigator.clipboard.writeText(link); toast(t("linkCopied")); }
      catch { $("installMsg").insertAdjacentHTML("beforeend", `<br><b dir="ltr">${esc(link)}</b>`); }
      return;
    }
    if (!installPrompt) return;
    installPrompt.prompt();
    try { await installPrompt.userChoice; } catch {}
    installPrompt = null; hideInstall(false); refreshInstallEntry();
  };
  function refreshInstallEntry() { $("installFromSettings").hidden = !canInstall(); }
  $("installFromSettings").onclick = () => { $("settingsDlg").close(); showInstall(true); };
  function setupInstall() {
    if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
    refreshInstallEntry();
    setTimeout(() => showInstall(false), 1500);
  }

  // ---------- settings & backup ----------
  $("settingsBtn").onclick = () => {
    $("sShop").value = shop.shop; $("sCode").value = shop.code; $("sMsgLang").value = prefs.msgLang;
    $("sShop").disabled = $("sCode").disabled = $("importBtn").disabled = readOnly;
    refreshInstallEntry();
    $("settingsDlg").showModal();
  };
  $("settingsForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    prefs.msgLang = $("sMsgLang").value; store(PKEY, prefs);
    const next = { shop: $("sShop").value.trim(), code: digits($("sCode").value) || "966" };
    $("settingsDlg").close();
    if (!readOnly && (next.shop !== shop.shop || next.code !== shop.code)) {
      shop = next;
      try { await saveShop(); } catch (err) { writeFailed(err); }
    }
    applyLang();
  });

  $("exportBtn").onclick = async () => {
    const json = JSON.stringify({ app: "tailor-orders", version: 1, exported: new Date().toISOString(), settings: shop, orders }, null, 2);
    const filename = `tailor-backup-${new Date().toISOString().slice(0, 10)}.json`;
    if (downloads) { try { await downloads.save({ filename, data: json }); } catch {} return; }
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([json], { type: "application/json" }));
    a.download = filename; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  };
  $("importBtn").onclick = () => $("importFile").click();
  $("importFile").addEventListener("change", async (e) => {
    const file = e.target.files[0]; e.target.value = "";
    if (!file) return;
    let data;
    try { data = JSON.parse(await file.text()); if (!Array.isArray(data.orders)) throw 0; }
    catch { toast(t("importErr")); return; }
    try {
      for (const o of data.orders) {
        if (!o || !o.id || !o.name || !o.invoice) continue;
        await saveOrder({ id: String(o.id), name: String(o.name), mobile: String(o.mobile || ""), book: String(o.book || ""),
          invoice: String(o.invoice), status: ["pending", "ready", "delivered"].includes(o.status) ? o.status : "pending",
          due: String(o.due || ""), notes: String(o.notes || ""), invDate: String(o.invDate || ""), cleared: String(o.cleared || ""), readyDate: String(o.readyDate || ""), qty: qtyOf(o), created: Number(o.created) || Date.now(), updated: Number(o.updated) || Date.now() });
      }
      toast(t("imported"));
    } catch (err) { writeFailed(err); }
  });

  applyLang();
  setView(location.hash.slice(1));
  initCloud();
})();
</script>
